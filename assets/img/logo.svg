<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150" width="100%" height="100%">
    <!-- Definição do Gradiente Contínuo: Escuro -> Lilás -> Primavera -->
    <defs>
        <!-- x1="0%" e x2="100%" faz o gradiente fluir da esquerda para a direita -->
        <linearGradient id="gradienteSkillMatch" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#1E1B4B; stop-opacity:1" /> <!-- Índigo Escuro (Sobriedade) -->
            <stop offset="40%" style="stop-color:#A855F7; stop-opacity:1" /> <!-- Lilás -->
            <stop offset="70%" style="stop-color:#FF8DA1; stop-opacity:1" /> <!-- Rosa Tulipa -->
            <stop offset="100%" style="stop-color:#FFAA85; stop-opacity:1" /> <!-- Pêssego -->
        </linearGradient>
    </defs>

    <!-- Ícone: Card Profissional Minimalista -->
    <g transform="translate(40, 35)">
        <rect x="0" y="0" width="70" height="70" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
        
        <!-- Símbolo < -->
        <path d="M 25 20 L 15 35 L 25 50" fill="none" stroke="#FF8DA1" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        
        <!-- Símbolo / -->
        <path d="M 40 15 L 30 55" fill="none" stroke="#60D394" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        
        <!-- Símbolo > -->
        <path d="M 45 20 L 55 35 L 45 50" fill="none" stroke="#FFAA85" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Texto do Logo: Centralizado verticalmente com dominant-baseline -->
    <text x="130" y="70" font-family="'Segoe UI', Helvetica, sans-serif" font-size="46" font-weight="800" letter-spacing="-1.5" fill="url(#gradienteSkillMatch)" dominant-baseline="middle">SkillMatch</text>
</svg>
